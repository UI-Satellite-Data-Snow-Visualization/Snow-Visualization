# Runs on every push to any branch and on every PR. Branch protection should require the
# "tests (...)" and "lint" checks below before a PR can merge.
name: CI

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

# A new push to the same branch or PR cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The team develops on Windows and macOS; the server will run on Linux.
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -ra

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.1
      # Real errors only (syntax errors, undefined names, unused imports), not style.
      # reference/ and archive/ are kept unchanged on purpose, so they're skipped.
      - run: ruff check --select E9,F --exclude archive,reference --output-format github .
